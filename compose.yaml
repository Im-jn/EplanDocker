services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      EPLAN_STORAGE_ROOT: /app/storage
      EPLAN_MAX_UPLOAD_BYTES: ${EPLAN_MAX_UPLOAD_BYTES:-1073741824}
    volumes:
      - ./storage:/app/storage
    user: "${EPLAN_UID:-1000}:${EPLAN_GID:-1000}"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pdf-parser-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      EPLAN_STORAGE_ROOT: /app/storage
      EPLAN_API_URL: http://api:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-api}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
    volumes:
      - ./storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${EPLAN_UID:-1000}:${EPLAN_GID:-1000}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
